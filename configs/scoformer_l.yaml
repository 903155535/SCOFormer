# SCO-L (373 M parameters): Table 3 and Table A.1 of the paper.
model:
  width: 1024          # C, embedding width
  depth: 24            # L, number of HybridBlocks
  n_kernels: 12        # K, basis kernels of the routed first block
  groups: 16           # G, GFFNO channel groups (group size C / G = 64)
  ffn_ratio: 4         # r, FFN expansion ratio
  modes: 9             # m, Fourier modes per axis
  img_size: 128
  patch_size: 8
  n_channels: 4        # d_u, physical channels padded with ones
  in_timesteps: 10     # T_in
  out_layer_dim: 32

data_root: ./data

pretrain:              # 8 GPUs x batch 20 = 160 samples per update
  datasets: [ns2d_fno_1e-5, ns2d_fno_1e-4, ns2d_fno_1e-3,
             ns2d_pdb_M1_eta1e-1_zeta1e-1, ns2d_pdb_M1_eta1e-2_zeta1e-2,
             ns2d_pdb_M1e-1_eta1e-1_zeta1e-1, ns2d_pdb_M1e-1_eta1e-2_zeta1e-2,
             swe_pdb, dr_pdb, ns2d_pda, ns2d_cond_pda, cfdbench]
  weights: [8, 2, 8, 1, 1, 1, 1, 20, 20, 1, 3, 1]   # w of Table 2: each dataset is repeated w times per epoch
  epochs: 1000
  warmup_epochs: 200
  batch_size: 20       # per GPU
  lr: 1.0e-3           # peak of the one-cycle schedule
  beta2: 0.9
  weight_decay: 1.0e-6
  grad_clip: 1.0e+4
  noise_scale: 5.0e-4  # epsilon
  eval_every: 20
  num_workers: 12

finetune:              # FT-500: one dataset, one GPU
  epochs: 500
  warmup_epochs: 40
  batch_size: 32
  lr: 1.0e-3
  beta2: 0.9
  weight_decay: 1.0e-6
  grad_clip: 1.0e+4
  noise_scale: 0.0
  eval_every: 10
  num_workers: 8
